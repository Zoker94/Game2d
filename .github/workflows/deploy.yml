name: Deploy to VPS

on:
  push:
    branches: [ ccr-5439a7cc-q4h8lm ] # Nhánh hiện tại của bạn trên GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/Game2d/server
            git pull origin ccr-5439a7cc-q4h8lm
            npm install
            pm2 restart index
