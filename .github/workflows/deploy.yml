name: Deploy to VPS

on:
  push:
    branches: [ccr-5439a7cc-q4h8lm]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/Game2d
            git pull origin ccr-5439a7cc-q4h8lm
            cd server
            npm install --omit=dev
               pm2 restart volampixel --update-env
