name: Build Android & PC apps

# Build app Android (APK 3 tài khoản) và app máy tính (Windows portable .exe), rồi chép lên VPS vào
# public/downloads để trang chủ có link tải. Chạy khi sửa thư mục apps/ hoặc bấm chạy tay.
on:
  push:
    branches: [ccr-5439a7cc-q4h8lm]
    paths: ['apps/**', '.github/workflows/build-apps.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      # Khoá ký APK: lấy từ Secrets ANDROID_KEYSTORE_B64 (file .jks mã hoá base64) + ANDROID_KEYSTORE_PASS.
      # Chưa có Secrets thì tạo khoá tạm cho lần build này (cài mới được, nhưng bản sau không cài đè được).
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "APK_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa cấu hình ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS – dùng khoá tạm"
            P=$(openssl rand -hex 16)
            echo "::add-mask::$P"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$P" -keypass "$P" -alias volam -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Vo Lam 2D, O=volam2d.com, C=VN"
            echo "APK_KEYSTORE_PASS=$P" >> "$GITHUB_ENV"
          fi
          echo "APK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "APK_KEY_ALIAS=volam" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: apps/android
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp apps/android/app/build/outputs/apk/release/app-release.apk VoLam2D.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: VoLam2D.apk }

  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build Windows portable
        working-directory: apps/pc
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: pc, path: apps/pc/dist/VoLam2D-PC.exe }

  upload:
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - name: Prepare folder on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 222.255.181.102
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p /var/www/Game2d/public/downloads
      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 222.255.181.102
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "out/VoLam2D.apk,out/VoLam2D-PC.exe"
          target: /var/www/Game2d/public/downloads
          strip_components: 1
